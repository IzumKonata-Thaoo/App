name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # build-number tăng dần theo mỗi lần chạy để cài đè được lên bản cũ
      - run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Đổi tên APK
        run: cp build/app/outputs/flutter-apk/app-release.apk MochiPlanner.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MochiPlanner-apk
          path: MochiPlanner.apk
          if-no-files-found: error

      - name: Đính kèm vào Release (khi đẩy tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MochiPlanner.apk
